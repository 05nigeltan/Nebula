[project]
name = "railguard"
version = "0.1.0"
description = "NebulaX PS3 train condition-monitoring pipelines"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "rainflow>=3.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "streamlit>=1.39,<2",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
